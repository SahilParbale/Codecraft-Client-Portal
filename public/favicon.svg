<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="50%" stop-color="#650019" />
      <stop offset="100%" stop-color="#42000f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdf79" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="14" stroke-linecap="round" />

  <!-- Stylized Brackets & Slash -->
  <!-- Left Bracket < -->
  <path d="M 215 170 L 140 256 L 215 342" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Bracket > -->
  <path d="M 297 170 L 372 256 L 297 342" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Slash / -->
  <line x1="280" y1="150" x2="232" y2="362" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" filter="url(#glow)" />
</svg>
