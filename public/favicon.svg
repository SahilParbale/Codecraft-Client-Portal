<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#550316" />
      <stop offset="55%" stop-color="#2a010a" />
      <stop offset="100%" stop-color="#120004" />
    </radialGradient>

    <!-- Ambient Ruby Glow -->
    <radialGradient id="rubyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#9f1239" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Layer 1 Gradients (Foundation) -->
    <linearGradient id="t1Top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800923" />
      <stop offset="50%" stop-color="#550314" />
      <stop offset="100%" stop-color="#3b020d" />
    </linearGradient>
    <linearGradient id="t1Left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d010a" />
      <stop offset="100%" stop-color="#180005" />
    </linearGradient>
    <linearGradient id="t1Right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#500416" />
      <stop offset="100%" stop-color="#2c020b" />
    </linearGradient>

    <!-- Layer 2 Gradients (Core Engine) -->
    <linearGradient id="t2Top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c3d" />
      <stop offset="50%" stop-color="#880e28" />
      <stop offset="100%" stop-color="#5a0418" />
    </linearGradient>
    <linearGradient id="t2Left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d0312" />
      <stop offset="100%" stop-color="#290108" />
    </linearGradient>
    <linearGradient id="t2Right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#800a24" />
      <stop offset="100%" stop-color="#4e0314" />
    </linearGradient>

    <!-- Layer 3 Gradients (Crown Interface) -->
    <linearGradient id="t3Top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="40%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#880824" />
    </linearGradient>
    <linearGradient id="t3Left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70061c" />
      <stop offset="100%" stop-color="#3e020d" />
    </linearGradient>
    <linearGradient id="t3Right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bd133a" />
      <stop offset="100%" stop-color="#6f071e" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="layerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="topShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Squircle with Bevel -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Ambient Glow Behind 3D Layers -->
  <ellipse cx="256" cy="260" rx="180" ry="160" fill="url(#rubyGlow)" />

  <!-- ========================================== -->
  <!-- TIER 1: Foundation Layer (Bottom Plate)    -->
  <!-- ========================================== -->
  <g filter="url(#layerShadow)">
    <!-- 3D Extruded Left Face -->
    <polygon points="96,335  256,410  256,427  96,352" fill="url(#t1Left)" />
    <!-- 3D Extruded Right Face -->
    <polygon points="256,410 416,335  416,352  256,427" fill="url(#t1Right)" />
    <!-- Top Face Plate -->
    <polygon points="256,260 416,335 256,410 96,335" fill="url(#t1Top)" />
    <!-- Glass Bevel Rim Highlights -->
    <polyline points="96,335 256,260 416,335" fill="none" stroke="rgba(255, 200, 215, 0.55)" stroke-width="2" />
    <polyline points="96,335 256,410 416,335" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <line x1="256" y1="410" x2="256" y2="427" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" />
  </g>

  <!-- ========================================== -->
  <!-- TIER 2: Core Processing Layer (Middle Plate) -->
  <!-- ========================================== -->
  <g filter="url(#layerShadow)">
    <!-- 3D Extruded Left Face -->
    <polygon points="128,245  256,305  256,320  128,260" fill="url(#t2Left)" />
    <!-- 3D Extruded Right Face -->
    <polygon points="256,305 384,245  384,260  256,320" fill="url(#t2Right)" />
    <!-- Top Face Plate -->
    <polygon points="256,185 384,245 256,305 128,245" fill="url(#t2Top)" />
    <!-- Glass Bevel Rim Highlights -->
    <polyline points="128,245 256,185 384,245" fill="none" stroke="rgba(255, 220, 230, 0.7)" stroke-width="2" />
    <polyline points="128,245 256,305 384,245" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <line x1="256" y1="305" x2="256" y2="320" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" />
  </g>

  <!-- ========================================== -->
  <!-- TIER 3: Crown Interface Layer (Top Plate)  -->
  <!-- ========================================== -->
  <g filter="url(#topShadow)">
    <!-- 3D Extruded Left Face -->
    <polygon points="160,155  256,200  256,213  160,168" fill="url(#t3Left)" />
    <!-- 3D Extruded Right Face -->
    <polygon points="256,200 352,155  352,168  256,213" fill="url(#t3Right)" />
    <!-- Top Face Plate -->
    <polygon points="256,110 352,155 256,200 160,155" fill="url(#t3Top)" />
    <!-- Radiant Glass Rim Highlights -->
    <polyline points="160,155 256,110 352,155" fill="none" stroke="rgba(255, 255, 255, 0.9)" stroke-width="2.5" />
    <polyline points="160,155 256,200 352,155" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" />
    <line x1="256" y1="200" x2="256" y2="213" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2" />
  </g>

  <!-- Vertical Core Energy Beam Connecting Layers -->
  <line x1="256" y1="120" x2="256" y2="350" stroke="rgba(255, 215, 0, 0.3)" stroke-width="3" stroke-dasharray="4,6" />

  <!-- ========================================== -->
  <!-- Top Tier Emblem: Glowing Codecraft Crest   -->
  <!-- ========================================== -->
  <g filter="url(#coreGlow)">
    <!-- Left Bracket < -->
    <path d="M 242 142 L 226 155 L 242 168" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Bracket > -->
    <path d="M 270 142 L 286 155 L 270 168" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Center Slash / (Golden Beam) -->
    <line x1="262" y1="137" x2="250" y2="173" stroke="url(#goldBeam)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Floating Isometric Tech Satellites -->
  <!-- Left Satellite -->
  <g transform="translate(110, 210)">
    <polygon points="0,-9 8,0 0,9 -8,0" fill="#f43f5e" stroke="rgba(255, 255, 255, 0.8)" stroke-width="1.5" />
  </g>
  <!-- Right Satellite -->
  <g transform="translate(400, 270)">
    <polygon points="0,-11 10,0 0,11 -10,0" fill="#f59e0b" stroke="rgba(255, 255, 255, 0.8)" stroke-width="1.5" />
  </g>
</svg>
